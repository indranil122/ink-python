name: Feature request
description: Suggest an improvement that helps learners or maintainers.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the learner problem first. Solutions are easier to evaluate once the problem is clear.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, missing or confusing today?
      placeholder: Learners cannot tell which exercises are published yet...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Ink do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered or workarounds.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Curriculum content
        - Browser runtime / exercises
        - Progress and gamification
        - Design and accessibility
        - Documentation and tooling
        - Deployment and performance
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This request does not require collecting personal data or adding accounts by default.
